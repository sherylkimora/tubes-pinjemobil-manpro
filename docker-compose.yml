# Opsional: lingkungan staging/dev seragam (SQL Server + API). Jalankan: docker compose up -d
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASS:-Pinjem#2026Staging}"
    ports: ["1433:1433"]
    volumes: [mssql_data:/var/opt/mssql]
  app:
    build: .
    depends_on: [db]
    ports: ["8080:80"]
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      DB_SERVER: db
      DB_NAME: pinjemobil
      DB_USER: sa
      DB_PASS: "${DB_PASS:-Pinjem#2026Staging}"
      DB_TRUST_CERT: "true"
      JWT_SECRET: "${JWT_SECRET:?isi JWT_SECRET di environment}"
volumes:
  mssql_data:
